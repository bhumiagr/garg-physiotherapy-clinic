<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Booked</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#07131f;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.box{
background:#0d2233;
padding:50px;
border-radius:20px;
text-align:center;
width:90%;
max-width:500px;
box-shadow:0 15px 35px rgba(0,0,0,.4);
}

h1{
color:#00e676;
margin-bottom:20px;
font-size:36px;
}

p{
line-height:30px;
color:#cfd8dc;
margin-bottom:30px;
}

a{
display:inline-block;
padding:15px 35px;
background:#00e676;
color:#07131f;
text-decoration:none;
font-weight:bold;
border-radius:50px;
transition:.3s;
}

a:hover{
background:#00c853;
color:white;
}

.check{
font-size:70px;
margin-bottom:20px;
}

</style>

</head>

<body>

<div class="box">

<div class="check">✅</div>

<h1>Appointment Booked!</h1>

<p>
Thank you for contacting Garg Physiotherapy Clinic.
We have received your appointment request.
Our team will contact you shortly.
</p>

<a href="index.html">Back to Home</a>

</div>

</body>
</html>
